<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXA Hydro-Core | Live Tank Level</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Orbitron', 'sans-serif'],
            tech: ['Rajdhani', 'sans-serif'],
            mono: ['"Share Tech Mono"', 'monospace'],
          },
          colors: { cyanGlow: '#00f0ff', hudDark: '#050a14' }
        }
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #02050b;
      color: #e2e8f0;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    .glass-panel {
      background: rgba(6, 12, 24, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 240, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(0, 240, 255, 0.05);
    }

    .glow-cyan-text {
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.8), 0 0 20px rgba(0, 240, 255, 0.4);
    }

    #liquidCanvasContainer {
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .live-dot { animation: livePulse 2s infinite; }
    @keyframes livePulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px #00f0ff; }
      50% { opacity: 0.4; box-shadow: 0 0 2px #00f0ff; }
    }

    .bg-grid {
      background-image: 
        linear-gradient(to right, rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* Tank image container - aspect ratio fixed */
    .tank-stage {
      position: relative;
      width: 100%;
      max-width: 520px;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
    }

    .tank-stage img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Calibration overlay */
    #calibrationOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    #calibrationOverlay.active { display: flex; }

    #calibImageWrap {
      position: relative;
      max-width: 100%;
      max-height: 60vh;
      display: inline-block;
    }
    #calibImageWrap img {
      display: block;
      max-width: 100%;
      max-height: 60vh;
      user-select: none;
      -webkit-user-drag: none;
    }
    #calibBox {
      position: absolute;
      border: 2px dashed #00f0ff;
      background: rgba(0, 240, 255, 0.15);
      cursor: move;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
    }
    .calib-handle {
      position: absolute;
      width: 18px;
      height: 18px;
      background: #00f0ff;
      border: 2px solid #02050b;
      border-radius: 50%;
      box-shadow: 0 0 8px #00f0ff;
    }
    .calib-handle.tl { top: -9px; left: -9px; cursor: nwse-resize; }
    .calib-handle.tr { top: -9px; right: -9px; cursor: nesw-resize; }
    .calib-handle.bl { bottom: -9px; left: -9px; cursor: nesw-resize; }
    .calib-handle.br { bottom: -9px; right: -9px; cursor: nwse-resize; }

    .calib-btn {
      padding: 10px 20px;
      border-radius: 10px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1px;
      border: 1px solid #00f0ff;
      background: rgba(0, 240, 255, 0.1);
      color: #00f0ff;
      cursor: pointer;
      transition: all 0.2s;
    }
    .calib-btn:hover, .calib-btn:active {
      background: rgba(0, 240, 255, 0.25);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
    }

    /* Mobile adjustments */
    @media (max-width: 640px) {
      .tank-stage { max-width: 92vw; }
    }
  </style>
</head>

<body class="min-h-screen flex flex-col font-tech bg-grid">

  <!-- HEADER -->
  <header class="w-full p-3 md:p-4 flex justify-between items-center z-20 glass-panel border-b-cyan-500/30">
    <div class="flex items-center gap-2 md:gap-3">
      <div class="w-9 h-9 md:w-10 md:h-10 rounded bg-cyan-900/40 border border-cyan-400 flex items-center justify-center shadow-[0_0_15px_rgba(0,240,255,0.3)]">
        <svg class="w-5 h-5 md:w-6 md:h-6 text-cyan-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
        </svg>
      </div>
      <div>
        <h1 class="text-lg md:text-2xl font-display font-bold text-white tracking-widest flex items-center gap-2">
          NEXA <span class="text-cyan-400">CORE</span>
        </h1>
        <p class="text-[9px] md:text-xs text-cyan-400/70 font-mono tracking-widest">LIVE TANK &bull; CH 3354981</p>
      </div>
    </div>
    <div class="flex flex-col items-end">
      <span class="text-[9px] md:text-[10px] text-slate-400 font-mono">STATUS</span>
      <span id="connStatus" class="text-xs md:text-sm font-bold text-cyan-400 tracking-wider flex items-center gap-2">
        <span id="connDot" class="w-2 h-2 rounded-full bg-cyan-400 live-dot"></span>
        <span id="connText">SYNC</span>
      </span>
    </div>
  </header>

  <!-- MAIN -->
  <main class="flex-1 w-full max-w-7xl mx-auto flex flex-col lg:flex-row items-center justify-center p-3 md:p-4 gap-4 md:gap-6 z-10 relative">

    <!-- LEFT PANEL -->
    <aside class="w-full lg:w-60 flex flex-row lg:flex-col gap-3 md:gap-4 order-2 lg:order-1">
      <div class="glass-panel p-3 md:p-4 rounded-xl flex-1 border-slate-800">
        <div class="text-[9px] md:text-[10px] font-mono text-slate-400 mb-1">RAW SENSOR</div>
        <div class="text-xl md:text-2xl font-display font-bold text-cyan-100"><span id="ui-raw">--</span></div>
      </div>
      <div class="glass-panel p-3 md:p-4 rounded-xl flex-1 border-slate-800">
        <div class="text-[9px] md:text-[10px] font-mono text-slate-400 mb-1">TEMPERATURE</div>
        <div class="text-xl md:text-2xl font-display font-bold text-emerald-300"><span id="ui-temp">22.4</span><span class="text-xs md:text-sm text-emerald-600">&deg;C</span></div>
      </div>
      <div class="glass-panel p-3 md:p-4 rounded-xl flex-1 border-slate-800 hidden md:block">
        <div class="text-[10px] font-mono text-slate-400 mb-1">VOLUME</div>
        <div class="text-2xl font-display font-bold text-white"><span id="ui-volume">0</span><span class="text-sm text-slate-500">L</span></div>
      </div>
    </aside>

    <!-- CENTER TANK STAGE -->
    <div class="w-full order-1 lg:order-2 flex flex-col items-center">
      <div class="tank-stage" id="tankStage">
        <!-- TANK IMAGE (ਇੱਥੇ ਆਪਣੀ ਫੋਟੋ ਦਾ ਨਾਮ ਪਾਓ) -->
        <img 
          id="tankImage"
          src="tank.jpg" 
          alt="Tank" 
          onerror="this.style.opacity='0.15'; this.parentElement.classList.add('bg-slate-900');"
        />

        <!-- LIQUID CANVAS OVERLAY (ਇਹ ਟੈਂਕ ਦੇ ਅੰਦਰ ਪਾਣੀ ਦਿਖਾਏਗਾ) -->
        <div id="liquidCanvasContainer" class="absolute overflow-hidden" 
             style="left: 30%; width: 40%; top: 25%; height: 55%;">
          <canvas id="liquidCanvas" class="w-full h-full block"></canvas>
        </div>

        <!-- PERCENTAGE TRACKER -->
        <div id="trackerTag" class="absolute z-30 flex items-center transition-all duration-500 ease-out pointer-events-none" 
             style="left: 72%; top: 80%;">
          <div class="w-5 h-[1px] bg-cyan-400 shadow-[0_0_5px_#00f0ff]"></div>
          <div class="glass-panel px-2 py-1 rounded border-cyan-400/50 ml-1">
            <div class="text-[8px] font-mono text-cyan-300 tracking-wider">LEVEL</div>
            <div id="trackerPercent" class="text-base font-display font-bold text-white glow-cyan-text">0.0%</div>
          </div>
        </div>

        <!-- LIVE BADGE -->
        <div class="absolute top-2 left-2 z-30 glass-panel px-2 py-1 rounded-full border-cyan-400/40 flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 live-dot"></span>
          <span class="text-[9px] font-mono text-cyan-300 tracking-widest">LIVE</span>
        </div>
      </div>

      <!-- CALIBRATION BUTTON -->
      <button id="btnCalibrate" class="calib-btn mt-3 md:mt-4">
        ⚙ CALIBRATE TANK AREA
      </button>
    </div>

    <!-- RIGHT PANEL -->
    <aside class="w-full lg:w-60 flex flex-row lg:flex-col gap-3 md:gap-4 order-3">
      <div class="glass-panel p-3 md:p-4 rounded-xl flex-1 border-slate-800">
        <div class="text-[9px] md:text-[10px] font-mono text-slate-400 mb-1">LEVEL %</div>
        <div class="text-xl md:text-2xl font-display font-bold text-blue-300"><span id="ui-level">0.0</span><span class="text-xs md:text-sm text-blue-600">%</span></div>
      </div>
      <div class="glass-panel p-3 md:p-4 rounded-xl flex-1 border-slate-800">
        <div class="text-[9px] md:text-[10px] font-mono text-slate-400 mb-1">LAST UPDATE</div>
        <div id="ui-last-update" class="text-xs md:text-sm font-display font-bold text-rose-300">--:--</div>
      </div>
      <div class="glass-panel p-3 md:p-4 rounded-xl flex-1 border-slate-800 hidden md:block">
        <div class="text-[10px] font-mono text-slate-400 mb-1">FEED</div>
        <div id="ui-pump-status" class="text-lg font-display font-bold text-slate-500">WAIT</div>
      </div>
    </aside>
  </main>

  <!-- FOOTER INFO -->
  <footer class="w-full max-w-3xl mx-auto p-3 md:p-4 mb-2 z-20">
    <div class="glass-panel p-3 md:p-4 rounded-2xl border-cyan-500/20 shadow-xl">
      <div class="grid grid-cols-3 gap-2 text-center">
        <div>
          <div class="text-[8px] md:text-[9px] font-mono text-slate-500 tracking-widest">CHANNEL</div>
          <div class="text-xs md:text-sm font-display font-bold text-cyan-300">3354981</div>
        </div>
        <div>
          <div class="text-[8px] md:text-[9px] font-mono text-slate-500 tracking-widest">FIELD</div>
          <div class="text-xs md:text-sm font-display font-bold text-cyan-300">FIELD 1</div>
        </div>
        <div>
          <div class="text-[8px] md:text-[9px] font-mono text-slate-500 tracking-widest">REFRESH</div>
          <div class="text-xs md:text-sm font-display font-bold text-cyan-300">15s</div>
        </div>
      </div>
    </div>
  </footer>

  <!-- ============================================ -->
  <!-- CALIBRATION OVERLAY                          -->
  <!-- ============================================ -->
  <div id="calibrationOverlay">
    <div class="text-cyan-300 font-display text-sm md:text-base mb-3 tracking-widest text-center">
      ਟੈਂਕ ਦੇ ਅੰਦਰਲੇ ਹਿੱਸੇ ਨੂੰ ਚੁਣੋ
    </div>
    <div class="text-slate-400 font-mono text-[10px] md:text-xs mb-3 text-center px-4">
      Box ਨੂੰ ਟੈਂਕ ਦੇ ਅੰਦਰ ਖਿੱਚੋ ਤੇ ਕੋਨਿਆਂ ਨਾਲ Size ਸੈੱਟ ਕਰੋ
    </div>

    <div id="calibImageWrap">
      <img id="calibImage" src="tank.jpg" alt="Calibrate"
           onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22400%22><rect width=%22400%22 height=%22400%22 fill=%22%23111827%22/><text x=%22200%22 y=%22200%22 fill=%22%2364748b%22 font-size=%2216%22 text-anchor=%22middle%22>tank.jpg not found</text></svg>'" />
      <div id="calibBox">
        <div class="calib-handle tl" data-handle="tl"></div>
        <div class="calib-handle tr" data-handle="tr"></div>
        <div class="calib-handle bl" data-handle="bl"></div>
        <div class="calib-handle br" data-handle="br"></div>
      </div>
    </div>

    <div class="flex gap-3 mt-5">
      <button id="btnCalibCancel" class="calib-btn" style="border-color:#f43f5e;color:#f43f5e;background:rgba(244,63,94,0.1);">CANCEL</button>
      <button id="btnCalibSave" class="calib-btn">✓ SAVE AREA</button>
    </div>
  </div>

  <script>
    // ============================================================
    // THINGSPEAK CONFIG
    // ============================================================
    const THINGSPEAK_CHANNEL_ID = 3354981;
    const THINGSPEAK_FIELD = 1;
    const THINGSPEAK_READ_API_KEY = ''; // ਪ੍ਰਾਈਵੇਟ ਹੋਵੇ ਤਾਂ key ਪਾਓ
    const POLL_INTERVAL_MS = 15000;

    // ============================================================
    // STATE
    // ============================================================
    let waterLevel = 0.0;
    let rawSensorValue = null;
    let lastUpdateTime = null;
    let isConnected = false;
    const MAX_CAPACITY_L = 10000;

    // Tank calibration (as % of image width/height)
    let tankRect = { left: 30, top: 25, width: 40, height: 55 };

    // Load saved calibration
    try {
      const saved = localStorage.getItem('nexa_tank_calib');
      if (saved) tankRect = JSON.parse(saved);
    } catch(e) {}

    // ============================================================
    // DOM
    // ============================================================
    const canvas = document.getElementById('liquidCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('liquidCanvasContainer');
    const tankStage = document.getElementById('tankStage');
    const trackerTag = document.getElementById('trackerTag');
    const trackerPercent = document.getElementById('trackerPercent');

    const uiRaw = document.getElementById('ui-raw');
    const uiTemp = document.getElementById('ui-temp');
    const uiVolume = document.getElementById('ui-volume');
    const uiLevel = document.getElementById('ui-level');
    const uiPumpStatus = document.getElementById('ui-pump-status');
    const uiLastUpdate = document.getElementById('ui-last-update');
    const connText = document.getElementById('connText');
    const connDot = document.getElementById('connDot');

    // ============================================================
    // APPLY CALIBRATION
    // ============================================================
    function applyCalibration() {
      container.style.left = tankRect.left + '%';
      container.style.top = tankRect.top + '%';
      container.style.width = tankRect.width + '%';
      container.style.height = tankRect.height + '%';

      // Tracker position (right side of tank)
      trackerTag.style.left = (tankRect.left + tankRect.width + 2) + '%';
      trackerTag.style.top = (tankRect.top + tankRect.height) + '%';

      resizeCanvas();
    }

    // ============================================================
    // CANVAS RESIZE
    // ============================================================
    function resizeCanvas() {
      const rect = container.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 300));

    // ============================================================
    // THINGSPEAK FETCH
    // ============================================================
    async function fetchThingSpeakData() {
      try {
        let url = `https://api.thingspeak.com/channels/${THINGSPEAK_CHANNEL_ID}/fields/${THINGSPEAK_FIELD}/last.json`;
        if (THINGSPEAK_READ_API_KEY) url += `?api_key=${THINGSPEAK_READ_API_KEY}`;

        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);

        const data = await response.json();
        const fieldKey = 'field' + THINGSPEAK_FIELD;

        if (data && data[fieldKey] !== undefined && data[fieldKey] !== null && data[fieldKey] !== '') {
          rawSensorValue = parseFloat(data[fieldKey]);
          lastUpdateTime = data.created_at ? new Date(data.created_at) : new Date();

          // INVERTED MAPPING: field 25 → 75% level
          let level = 100 - rawSensorValue;
          waterLevel = Math.max(0, Math.min(100, level));

          if (!isConnected) {
            isConnected = true;
            updateConnectionUI(true);
          }
        }
      } catch (err) {
        console.warn('ThingSpeak error:', err);
        updateConnectionUI(false);
      }
    }

    function updateConnectionUI(connected) {
      if (connected) {
        connText.textContent = 'ONLINE';
        connDot.className = 'w-2 h-2 rounded-full bg-cyan-400 live-dot';
      } else {
        connText.textContent = 'OFFLINE';
        connDot.className = 'w-2 h-2 rounded-full bg-rose-500';
        isConnected = false;
      }
    }

    // ============================================================
    // TELEMETRY UI
    // ============================================================
    function updateTelemetry() {
      trackerPercent.textContent = waterLevel.toFixed(1) + '%';
      uiLevel.textContent = waterLevel.toFixed(1);
      uiVolume.textContent = Math.round((waterLevel / 100) * MAX_CAPACITY_L).toLocaleString();
      uiRaw.textContent = rawSensorValue !== null ? rawSensorValue.toFixed(1) : '--';

      // Tracker Y position inside tank area
      const trackerMinTop = tankRect.top;
      const trackerMaxTop = tankRect.top + tankRect.height;
      const currentTop = trackerMaxTop - (waterLevel / 100) * (trackerMaxTop - trackerMinTop);
      trackerTag.style.top = currentTop + '%';

      uiTemp.textContent = (18.2 + (waterLevel / 100) * 4.3).toFixed(1);

      if (lastUpdateTime) {
        const hh = String(lastUpdateTime.getHours()).padStart(2, '0');
        const mm = String(lastUpdateTime.getMinutes()).padStart(2, '0');
        uiLastUpdate.textContent = `${hh}:${mm}`;
      }

      if (!isConnected) {
        uiPumpStatus.textContent = 'NO SIGNAL';
        uiPumpStatus.className = 'text-lg font-display font-bold text-rose-500';
      } else if (waterLevel >= 99.5) {
        uiPumpStatus.textContent = 'FULL';
        uiPumpStatus.className = 'text-lg font-display font-bold text-cyan-400';
      } else if (waterLevel <= 0.5) {
        uiPumpStatus.textContent = 'EMPTY';
        uiPumpStatus.className = 'text-lg font-display font-bold text-amber-400';
      } else {
        uiPumpStatus.textContent = 'NORMAL';
        uiPumpStatus.className = 'text-lg font-display font-bold text-emerald-400';
      }
    }

    // ============================================================
    // RENDER LOOP (Realistic Water)
    // ============================================================
    let wavePhase = 0;
    let lastTime = performance.now();

    function render(currentTime) {
      const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
      lastTime = currentTime;

      updateTelemetry();

      const rect = container.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;

      if (w > 0 && h > 0) {
        ctx.clearRect(0, 0, w, h);

        if (waterLevel > 0) {
          const liquidHeight = (waterLevel / 100) * h;
          const surfaceY = h - liquidHeight;

          const waveAmplitude = w * 0.012;
          wavePhase += 0.05;

          // === LIQUID BODY ===
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(0, h);
          ctx.lineTo(0, surfaceY);

          for (let x = 0; x <= w; x += 2) {
            const waveOffset =
              Math.sin(x * 0.05 + wavePhase) * waveAmplitude +
              Math.cos(x * 0.03 - wavePhase * 1.5) * (waveAmplitude * 0.5);
            ctx.lineTo(x, Math.max(0, Math.min(h, surfaceY + waveOffset)));
          }
          ctx.lineTo(w, h);
          ctx.closePath();

          // Realistic water gradient (deep blue → bright cyan surface)
          const fluidGradient = ctx.createLinearGradient(0, surfaceY, 0, h);
          fluidGradient.addColorStop(0.0, 'rgba(120, 230, 255, 0.95)');
          fluidGradient.addColorStop(0.15, 'rgba(0, 200, 255, 0.85)');
          fluidGradient.addColorStop(0.5, 'rgba(0, 130, 220, 0.65)');
          fluidGradient.addColorStop(1.0, 'rgba(0, 40, 130, 0.45)');

          ctx.fillStyle = fluidGradient;
          ctx.fill();

          // === GLOWING SURFACE LINE ===
          ctx.lineWidth = 2.5;
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
          ctx.shadowColor = '#00ffff';
          ctx.shadowBlur = 12;

          ctx.beginPath();
          let first = true;
          for (let x = 0; x <= w; x += 2) {
            const waveOffset =
              Math.sin(x * 0.05 + wavePhase) * waveAmplitude +
              Math.cos(x * 0.03 - wavePhase * 1.5) * (waveAmplitude * 0.5);
            const y = Math.max(0, Math.min(h, surfaceY + waveOffset));
            if (first) { ctx.moveTo(x, y); first = false; }
            else { ctx.lineTo(x, y); }
          }
          ctx.stroke();
          ctx.restore();
        }
      }

      requestAnimationFrame(render);
    }

    // ============================================================
    // CALIBRATION TOOL
    // ============================================================
    const overlay = document.getElementById('calibrationOverlay');
    const calibImageWrap = document.getElementById('calibImageWrap');
    const calibImage = document.getElementById('calibImage');
    const calibBox = document.getElementById('calibBox');
    let calibState = { x: 30, y: 25, w: 40, h: 55 }; // percentages
    let isDragging = false, dragMode = null, dragStart = null;

    document.getElementById('btnCalibrate').addEventListener('click', () => {
      calibState = { ...tankRect };
      overlay.classList.add('active');
      setTimeout(updateCalibBox, 50);
    });

    document.getElementById('btnCalibCancel').addEventListener('click', () => {
      overlay.classList.remove('active');
    });

    document.getElementById('btnCalibSave').addEventListener('click', () => {
      tankRect = { ...calibState };
      try { localStorage.setItem('nexa_tank_calib', JSON.stringify(tankRect)); } catch(e) {}
      applyCalibration();
      overlay.classList.remove('active');
    });

    function updateCalibBox() {
      const wrapRect = calibImageWrap.getBoundingClientRect();
      calibBox.style.left = calibState.x + '%';
      calibBox.style.top = calibState.y + '%';
      calibBox.style.width = calibState.w + '%';
      calibBox.style.height = calibState.h + '%';
    }

    // Pointer events on box (drag to move)
    calibBox.addEventListener('pointerdown', (e) => {
      if (e.target.classList.contains('calib-handle')) return;
      e.preventDefault();
      isDragging = true;
      dragMode = 'move';
      dragStart = { x: e.clientX, y: e.clientY, ...calibState };
      calibBox.setPointerCapture(e.pointerId);
    });

    // Pointer events on handles (drag to resize)
    calibBox.querySelectorAll('.calib-handle').forEach(h => {
      h.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        isDragging = true;
        dragMode = h.dataset.handle;
        dragStart = { x: e.clientX, y: e.clientY, ...calibState };
        h.setPointerCapture(e.pointerId);
      });
    });

    calibBox.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const wrapRect = calibImageWrap.getBoundingClientRect();
      const dx = ((e.clientX - dragStart.x) / wrapRect.width) * 100;
      const dy = ((e.clientY - dragStart.y) / wrapRect.height) * 100;

      let { x, y, w, h } = dragStart;

      if (dragMode === 'move') {
        x += dx; y += dy;
      } else if (dragMode === 'tl') {
        x += dx; y += dy; w -= dx; h -= dy;
      } else if (dragMode === 'tr') {
        y += dy; w += dx; h -= dy;
      } else if (dragMode === 'bl') {
        x += dx; w -= dx; h += dy;
      } else if (dragMode === 'br') {
        w += dx; h += dy;
      }

      // Clamp
      w = Math.max(5, Math.min(100, w));
      h = Math.max(5, Math.min(100, h));
      x = Math.max(0, Math.min(100 - w, x));
      y = Math.max(0, Math.min(100 - h, y));

      calibState = { x, y, w, h };
      updateCalibBox();
    });

    ['pointerup', 'pointercancel'].forEach(evt => {
      calibBox.addEventListener(evt, () => { isDragging = false; dragMode = null; });
    });

    // ============================================================
    // BOOTSTRAP
    // ============================================================
    applyCalibration();
    setTimeout(resizeCanvas, 200);

    fetchThingSpeakData();
    setInterval(fetchThingSpeakData, POLL_INTERVAL_MS);
    requestAnimationFrame(render);
  </script>
</body>
</html>
